name: Sync FP Preview
# Manual dispatch marker: 2026-08-24T12:41+02:00

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-fp-preview.yml'

permissions:
  contents: write
  pages: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message || '', 'Sync FP preview from source') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download current FP source
        env:
          FENIX_SOURCE_TOKEN: ${{ secrets.FENIX_SOURCE_TOKEN }}
        run: |
          if [ -z "$FENIX_SOURCE_TOKEN" ]; then
            echo "FENIX_SOURCE_TOKEN secret is missing."
            exit 1
          fi
          mkdir -p /tmp/fenix-source
          curl --fail --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $FENIX_SOURCE_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/opalkop/fenix/zipball/feature/fenix-portable-mobile" \
            -o /tmp/fenix-source.zip
          unzip -q /tmp/fenix-source.zip -d /tmp/fenix-unpacked
          SOURCE_DIR="$(find /tmp/fenix-unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "$SOURCE_DIR" ]; then
            echo "Downloaded archive did not contain a source directory."
            exit 1
          fi
          rsync -a "$SOURCE_DIR/" /tmp/fenix-source/

      - name: Mirror FP into preview
        run: |
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            /tmp/fenix-source/ ./

      - name: Commit synchronized preview
        id: sync_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Preview already matches source."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Sync FP preview from source"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger GitHub Pages rebuild
        if: steps.sync_commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --request POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/opalkop/fenix-fp-preview/pages/builds
