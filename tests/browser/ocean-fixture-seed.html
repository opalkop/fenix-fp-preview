<!doctype html><html><head><meta charset="utf-8"><title>Ocean fixture seed</title></head><body><pre id="status">SEEDING</pre><script>
"use strict";
(async()=>{
  const out=document.getElementById("status"),fixture=await(await fetch("../../.e2e/ocean-fantasy-3.json",{cache:"no-store"})).json(),project=fixture.project,library=fixture.library;
  const stripAsset=asset=>({...asset,dataUrl:""}),stripPage=page=>({...page,preview:{...(page.preview||{}),imageData:null},solution:{...(page.solution||{}),imageData:null}});
  localStorage.setItem("fenix-projects-v1",JSON.stringify([{...project,pages:project.pages.map(stripPage),assets:Object.fromEntries(Object.entries(project.assets||{}).map(([id,asset])=>[id,stripAsset(asset)]))}]));
  localStorage.setItem("fenix-active-project-v1",project.id);
  localStorage.setItem("fenix-asset-library-v1",JSON.stringify(Object.fromEntries(Object.entries(library).map(([id,asset])=>[id,stripAsset(asset)]))));
  const db=await new Promise((resolve,reject)=>{const request=indexedDB.open("fenix-assets-v1",1);request.onupgradeneeded=()=>{const value=request.result;if(!value.objectStoreNames.contains("assets")){const store=value.createObjectStore("assets",{keyPath:"key"});store.createIndex("projectId","projectId",{unique:false})}};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)}),tx=db.transaction("assets","readwrite"),store=tx.objectStore("assets");
  store.clear();let saved=0;
  for(const [id,asset] of Object.entries(project.assets||{})){const ref=String(asset.libraryRef||asset.meta?.libraryRef||""),source=ref?library[ref]:asset;if(!source?.dataUrl)continue;const scope=ref?"__fenix_library__":project.id,assetId=ref||id;store.put({key:`${scope}::${assetId}`,projectId:scope,assetId,dataUrl:source.dataUrl,mime:source.mime||asset.mime||"",updatedAt:new Date().toISOString()});saved++}
  await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)});db.close();
  out.textContent=`READY ${project.name} · pages=${project.pages.length} · solutions=${project.pages.filter(page=>page.solution?.available).length} · assets=${saved}`;document.body.dataset.ready="true";
})().catch(error=>{document.getElementById("status").textContent=`ERROR ${error.stack||error}`;document.body.dataset.ready="error"});
</script></body></html>
