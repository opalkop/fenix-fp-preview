<!doctype html><html><body>
<select id="pageSelect"><option value="">Nowa strona</option></select>
<input id="title" value="Help the Turtle Find the Shell!"><input id="subtitle" value="Ocean Mission 1"><input id="instruction" value="Guide the turtle through the maze to the shell.">
<input id="titleSize" value="96"><input id="titleY" value="230"><input id="subtitleSize" value="52"><input id="instructionSize" value="52">
<select id="ageProfile"><option value="4-6" selected>4-6</option></select><select id="difficulty"><option value="easy" selected>easy</option><option value="custom">custom</option></select>
<input id="cols" value="12"><input id="rows" value="16"><input id="lineWidth" value="2"><select id="endpointMode"><option value="random" selected>random</option></select><select id="wallStyle"><option value="clean" selected>clean</option></select><input id="seed" value="1">
<select id="startAsset"><option value="turtle" selected>turtle</option></select><select id="goalAsset"><option value="shell" selected>shell</option></select><select id="checkpointAsset1"><option value="part-1" selected>part-1</option></select><select id="checkpointAsset2"><option value="part-2" selected>part-2</option></select><select id="checkpointAsset3"><option value="part-3" selected>part-3</option></select><select id="checkpointAsset4"><option value="part-4" selected>part-4</option></select><select id="checkpointAsset5"><option value="part-5" selected>part-5</option></select><select id="hazardAsset"><option value="">none</option></select>
<input id="startAssetScale" value="180"><input id="goalAssetScale" value="140"><input id="checkpointCount" value="5"><input id="checkpointScale1" value="115"><input id="checkpointScale2" value="150"><input id="checkpointScale3" value="150"><input id="checkpointScale4" value="160"><input id="checkpointScale5" value="160"><input id="hazardCount" value="0"><input id="hazardScale" value="78"><div id="decoAssetChoices"></div><input id="decoCount" value="0"><input id="decoScale" value="80">
<input id="sideMargin" value="80"><input id="topMargin" value="170"><input id="bottomMargin" value="90"><input id="mazeScale" value="92"><select id="solution"><option value="no" selected>no</option></select>
<button id="saveCart">save</button><button id="saveCopy">copy</button><div id="status"></div><pre id="out"></pre>
<script src="../core/page-schema.js"></script>
<script>
(()=>{let cart=[];window.FenixCore={getCart:()=>cart,getAsset:id=>({id,pack:'ROBO X1'}),addPage:data=>{cart=[...cart,{...data,id:'maze-1'}];window.dispatchEvent(new CustomEvent('fenix-state-change',{detail:{cart:true}}))},updatePage:(id,data)=>{cart=cart.map(p=>p.id===id?{...data,id}:p);window.dispatchEvent(new CustomEvent('fenix-state-change',{detail:{cart:true}}))}};
window.addEventListener('fenix-state-change',()=>{document.getElementById('cols').value='18';document.getElementById('rows').value='24';document.getElementById('difficulty').value='custom';document.getElementById('startAsset').value='';document.getElementById('goalAsset').value='';for(let i=1;i<=5;i++)document.getElementById(`checkpointAsset${i}`).value='';});})();
</script>
<script src="../modules/maze-studio/maze-save-stabilizer.js"></script>
<script>
setTimeout(()=>{document.getElementById('saveCart').click();setTimeout(()=>{const saved=FenixCore.getCart()[0],s=saved?.recipe?.settings||{},checks=[['form cols unchanged',document.getElementById('cols').value==='12'],['form rows unchanged',document.getElementById('rows').value==='16'],['form difficulty unchanged',document.getElementById('difficulty').value==='easy'],['form start asset unchanged',document.getElementById('startAsset').value==='turtle'],['form goal asset unchanged',document.getElementById('goalAsset').value==='shell'],['form checkpoint assets unchanged',Array.from({length:5},(_,i)=>document.getElementById(`checkpointAsset${i+1}`).value===`part-${i+1}`).every(Boolean)],['saved 12x16',s.cols===12&&s.rows===16],['saved lineWidth 2',s.lineWidth===2],['saved asset refs',s.startAssetRef==='turtle'&&s.goalAssetRef==='shell'],['saved five checkpoint refs',s.checkpointAssets?.length===5&&s.checkpointAssets.every((item,i)=>item.assetRef===`part-${i+1}`)],['saved checkpoint scales',s.checkpointAssets?.map(item=>item.scale).join(',')==='115,150,150,160,160'],['saved pack metadata',s.startAssetPack==='ROBO X1'&&s.checkpointAssets?.every(item=>item.pack==='ROBO X1')],['saved scales',s.startAssetScale===180&&s.goalAssetScale===140]];const failed=checks.filter(([,ok])=>!ok);document.getElementById('out').textContent=(failed.length?'Maze save regression FAIL':'Maze save regression PASS')+'\n'+checks.map(([n,ok])=>(ok?'✓ ':'✗ ')+n).join('\n');document.documentElement.dataset.mazeSaveRegression=failed.length?'fail':'pass'},0)},0);
</script></body></html>
