<!doctype html>
<html>
  <body>
    <select id="pageSelect"><option value="maze-1" selected>Maze #1</option></select>
    <input id="checkpointCount" value="5">
    <div class="asset-maze-grid">
      <label>START<select id="startAsset"></select></label>
      <label>META<select id="goalAsset"></select></label>
      <label>CP1<select id="checkpointAsset1"></select></label>
      <label>CP2<select id="checkpointAsset2"></select></label>
      <label>CP3<select id="checkpointAsset3"></select></label>
      <label>CP4<select id="checkpointAsset4"></select></label>
      <label>CP5<select id="checkpointAsset5"></select></label>
      <label>HAZARD<select id="hazardAsset"></select></label>
    </div>
    <div id="assetInfo"></div>
    <pre id="out"></pre>
    <script>
      (() => {
        const definitions = [
          ["head", "X1 head"],
          ["factory", "Robot Factory"],
          ["body", "X1 body"],
          ["left-arm", "X1 left arm"],
          ["right-arm", "X1 right arm"],
          ["left-leg", "X1 left leg"],
          ["right-leg", "X1 right leg"],
        ];
        const library = definitions.map(([id, name]) => ({
          id: `lib-${id}`,
          name,
          pack: "ROBO X1",
        }));
        const project = library.map((asset) => ({
          ...asset,
          id: `library-${asset.id}`,
          libraryRef: asset.id,
          meta: { libraryRef: asset.id, pack: asset.pack },
        }));
        const settings = {
          startAssetRef: "library-lib-head",
          startAssetPack: "ROBO X1",
          goalAssetRef: "library-lib-factory",
          goalAssetPack: "ROBO X1",
          checkpointCount: 5,
          checkpointAssets: [
            ["body", 115],
            ["left-arm", 150],
            ["right-arm", 150],
            ["left-leg", 160],
            ["right-leg", 160],
          ].map(([id, scale]) => ({
            assetRef: `library-lib-${id}`,
            scale,
            pack: "ROBO X1",
          })),
        };
        window.FenixCore = {
          ready: Promise.resolve(),
          getCart: () => [
            { id: "maze-1", module: "maze-studio", recipe: { settings } },
          ],
          listLibraryPacks: () => ["ROBO X1"],
          listLibraryAssets: ({ pack } = {}) =>
            pack ? library.filter((asset) => asset.pack === pack) : library,
          listAssets: () => project,
          getAsset: (id) => project.find((asset) => asset.id === id) || null,
          linkLibraryAsset: (id) =>
            project.find((asset) => asset.libraryRef === id) || null,
        };
      })();
    </script>
    <script src="../modules/maze-studio/maze-global-asset-picker.js"></script>
    <script>
      setTimeout(() => {
        const expected = {
          startAsset: "library-lib-head",
          goalAsset: "library-lib-factory",
          checkpointAsset1: "library-lib-body",
          checkpointAsset2: "library-lib-left-arm",
          checkpointAsset3: "library-lib-right-arm",
          checkpointAsset4: "library-lib-left-leg",
          checkpointAsset5: "library-lib-right-leg",
        };
        const checks = Object.entries(expected).map(([id, value]) => [
          `${id} restored`,
          document.getElementById(id)?.value === value,
        ]);
        checks.push([
          "all packs restored",
          [
            "startAssetPack",
            "goalAssetPack",
            "checkpointAssetPack1",
            "checkpointAssetPack2",
            "checkpointAssetPack3",
            "checkpointAssetPack4",
            "checkpointAssetPack5",
          ].every((id) => document.getElementById(id)?.value === "ROBO X1"),
        ]);
        const failed = checks.filter(([, ok]) => !ok);
        document.getElementById("out").textContent =
          (failed.length
            ? "Maze asset reload regression FAIL"
            : "Maze asset reload regression PASS") +
          "\n" +
          checks.map(([name, ok]) => `${ok ? "✓" : "✗"} ${name}`).join("\n");
        document.documentElement.dataset.mazeAssetReloadRegression =
          failed.length ? "fail" : "pass";
      }, 850);
    </script>
  </body>
</html>
