<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tracing Studio — FENIX</title><link rel="stylesheet" href="../../assets/app.css"><link rel="stylesheet" href="tracing.css?v=0.31.0"></head><body data-module="tracing-studio" data-engine="specialized"><header class="trace-head"><div><p class="eyebrow">FENIX / STUDIO PRODUKCYJNE</p><h1>Tracing Studio</h1><p>Asset tracing z precyzyjną obróbką SVG/PNG.</p></div><div class="head-actions"><a href="../../index.html">← Dashboard</a><button id="png">Eksport PNG 300 DPI</button></div></header><main class="tracing-layout"><section class="card controls"><div id="projectInfo" class="project-info"></div><div class="section-title">Źródło</div><div class="asset-import-row"><button id="importAsset" type="button">＋ Dodaj SVG / PNG</button><input id="assetFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" multiple hidden><span id="assetCount" class="note"></span></div><div id="assetEmpty" class="asset-empty">Brak assetów projektu.</div><div id="assetGrid" class="asset-grid"></div><div class="section-title">Obróbka i dopasowanie</div><div class="control-sections"><details open><summary>Geometria</summary><div class="form-grid"><label>Skala X (%)<input id="scaleX" type="number" min="10" max="220" value="80"></label><label>Skala Y (%)<input id="scaleY" type="number" min="10" max="220" value="80"></label><label>Pozycja X (%)<input id="assetX" type="number" min="5" max="95" value="50"></label><label>Pozycja Y (%)<input id="assetY" type="number" min="20" max="90" value="58"></label><label>Obrót (°)<input id="rotation" type="number" min="-180" max="180" value="0"></label><label>Margines roboczy (%)<input id="workMargin" type="number" min="0" max="30" value="8"></label></div><div class="switch-row"><label><input id="flipX" type="checkbox"> Odbij poziomo</label><label><input id="flipY" type="checkbox"> Odbij pionowo</label><label><input id="showFrame" type="checkbox"> Pokaż pole robocze</label></div></details><details open><summary>Kontur i ślad</summary><div class="form-grid"><label>Tryb<select id="treatment"><option value="trace" selected>Jasny ślad</option><option value="outline">Kontur</option><option value="bw">Czarno-biały</option><option value="original">Oryginał</option></select></label><label>Próg B/W<input id="threshold" type="number" min="0" max="255" value="180"></label><label>Siła konturu<input id="edgeStrength" type="number" min="5" max="120" value="35"></label><label>Jasność<input id="brightness" type="number" min="40" max="180" value="105"></label><label>Kontrast<input id="contrast" type="number" min="40" max="220" value="125"></label><label>Przezroczystość (%)<input id="opacity" type="number" min="5" max="100" value="42"></label></div><div class="switch-row"><label><input id="invert" type="checkbox"> Odwróć czerń/biel</label><label><input id="smooth" type="checkbox" checked> Wygładzanie</label></div></details><details open><summary>Treść strony</summary><div class="form-grid"><label>Tytuł<input id="title" value="Trace the Picture!"></label><label>Instrukcja<input id="instructions" value="Trace the picture carefully."></label><label>Wielkość tytułu<input id="titleSize" type="number" min="64" max="180" value="112"></label><label>Pozycja tytułu<input id="titleY" type="number" min="140" max="420" value="230"></label><label>Wielkość instrukcji<input id="instructionSize" type="number" min="30" max="90" value="46"></label></div></details></div><div class="actions"><button id="reset" class="ghost">Reset obróbki</button><button id="generate">Odśwież podgląd</button><button id="cart">Dodaj stronę do projektu</button></div><p id="status" class="note">Wybierz asset.</p></section><section class="card preview-section"><div class="preview-heading"><div><p class="eyebrow">PODGLĄD</p><strong id="selectedAssetName">Brak assetu</strong></div></div><canvas id="page" width="2550" height="3300"></canvas></section></main><script src="../../core/fenix-core.js?v=0.23.0"></script><script src="tracing-core.js?v=0.31.0"></script><script src="tracing.js?v=0.31.0"></script></body></html>
