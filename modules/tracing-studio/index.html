<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tracing Studio — FENIX</title><link rel="stylesheet" href="../../assets/app.css"><link rel="stylesheet" href="tracing.css?v=0.29.1"></head>
<body data-module="tracing-studio" data-engine="specialized"><header><div><p class="eyebrow">FENIX / STUDIO PRODUKCYJNE</p><h1>Tracing Studio</h1><p>Twórz ćwiczenia śledzenia linii, kształtów i ścieżek gotowe do druku.</p></div><div class="header-actions"><a class="button ghost" href="../../index.html">← Dashboard</a><button id="png">Eksport PNG 300 DPI</button></div></header>
<main class="tracing-layout"><section class="card controls"><div id="projectInfo" class="project-info"></div><div class="section-title">Ustawienia strony</div><div class="control-sections">
<details open><summary>Treść strony</summary><div class="form-grid"><label>Tytuł<input id="title" value="Tracing Practice"></label><label>Instrukcja<input id="instructions" placeholder="puste = automatyczna"></label><label>Wielkość tytułu<input id="titleSize" type="number" min="64" max="180" value="112"></label><label>Pozycja tytułu<input id="titleY" type="number" min="140" max="420" value="230"></label><label>Wielkość instrukcji<input id="instructionSize" type="number" min="30" max="90" value="46"></label></div><div class="switch-row"><label><input id="showTitle" type="checkbox" checked> Pokaż tytuł</label><label><input id="showInstructions" type="checkbox" checked> Pokaż instrukcję</label></div></details>
<details open><summary>Ćwiczenie tracing</summary><div class="form-grid"><label>Typ ćwiczenia<select id="type"><option value="waves">Fale</option><option value="zigzag">Zygzaki</option><option value="loops">Pętle</option><option value="paths">Ścieżki</option><option value="shapes">Kształty</option><option value="mixed">Pakiet mieszany</option></select></label><label>Liczba rzędów<input id="rows" type="number" min="3" max="12" value="7"></label><label>Amplituda / wysokość<input id="amplitude" type="number" min="30" max="180" value="90"></label><label>Rozstaw wzoru<input id="spacing" type="number" min="80" max="360" value="190"></label><label>Grubość linii<input id="lineWidth" type="number" min="3" max="18" value="8"></label><label>Styl śladu<select id="dashStyle"><option value="normal">Klasyczny przerywany</option><option value="dots">Kropkowany</option><option value="long">Długie kreski</option></select></label></div><label class="guide-toggle"><input id="showGuides" type="checkbox" checked> Pokaż znaczniki START / META przy każdym rzędzie</label></details>
<details><summary>Wariant i seed</summary><div class="form-grid"><label>Seed<input id="seed" value="fenix-tracing-001"></label></div><p class="note">Seed pozwala wrócić do dokładnie tego samego wariantu strony.</p></details>
</div><div class="actions"><button id="randomSeed" class="ghost">Nowy wariant</button><button id="generate">Odśwież podgląd</button><button id="cart">Dodaj stronę do projektu</button></div><p id="status" class="note">Gotowy.</p></section>
<section class="hero preview-section"><div class="preview-heading"><div><p class="eyebrow">PODGLĄD STRONY</p><strong>Podgląd tracingu</strong></div></div><canvas id="page" width="2550" height="3300"></canvas></section></main>
<script src="../../core/fenix-core.js?v=0.23.0"></script><script src="tracing-core.js?v=0.29.1"></script><script src="tracing.js?v=0.29.1"></script></body></html>
