<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complete the Picture Studio — FENIX</title><link rel="stylesheet" href="../module.css"><link rel="stylesheet" href="complete-picture.css"></head>
<body data-module="complete-picture" data-engine="specialized">
<header class="top"><div><strong>FENIX / Complete the Picture Studio</strong><br><small>Dokończ obrazek · wspólny renderer produkcyjny</small></div><a href="../../index.html">← Dashboard</a></header>
<main class="ctp-layout"><aside class="ctp-panel"><div id="projectInfo" class="project-info"></div><div class="section-title">1. Rodzaj ćwiczenia</div><label class="field"><span>Typ zadania</span><select id="type"><option value="half-vertical">Dokończ drugą połowę — pionowo</option><option value="half-horizontal">Dokończ drugą połowę — poziomo</option><option value="shadow-trace">Rysuj po cieniu / śladzie</option><option value="grid-copy">Przerysuj obrazek w siatce</option><option value="missing-part">Dorysuj brakujący fragment</option><option value="mirror-pair">Narysuj odbicie lustrzane</option></select></label><div id="typeHelp" class="type-help"></div><div class="section-title">2. Obrazek</div><label class="field"><span>Źródło obrazka</span><select id="assetSource"><option value="built-in">Biblioteka Feniksa</option><option value="upload">Własny plik z komputera</option></select></label><div id="builtInAssetBox"><label class="field"><span>Motyw</span><select id="asset"><option value="butterfly">Motyl</option><option value="owl">Sowa</option><option value="rocket">Rakieta</option><option value="robot">Robot</option><option value="fish">Ryba</option><option value="flower">Kwiat</option><option value="cat">Kot</option><option value="ladybug">Biedronka</option><option value="castle">Zamek</option><option value="dino">Dinozaur</option><option value="car">Samochód</option><option value="mushroom">Grzybek</option></select></label></div><div id="uploadAssetBox" class="upload-box" hidden><label class="upload-button" for="assetFile">Wybierz asset z komputera</label><input id="assetFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml,.svg" hidden><div id="uploadStatus" class="upload-status">Nie wybrano pliku.</div><button id="clearAsset" type="button" class="small-button" disabled>Usuń własny asset</button></div><div class="row"><label class="field"><span>Trudność</span><select id="difficulty"><option value="easy">Łatwa</option><option value="medium" selected>Średnia</option><option value="hard">Trudna</option></select></label><label class="field"><span>Wiek</span><select id="age"><option>3–5</option><option selected>5–7</option><option>7–9</option></select></label></div><div class="row"><label class="field"><span>Rozmiar obrazka</span><input id="scale" type="range" min="55" max="125" value="94"></label><label class="field"><span>Grubość konturu</span><input id="lineWidth" type="range" min="2" max="8" value="4"></label></div><label class="field" id="shadowStrengthField" hidden><span>Widoczność cienia</span><input id="shadowStrength" type="range" min="10" max="55" value="28"></label><label class="check"><input id="showGuide" type="checkbox" checked><span>Linia podziału / oś symetrii</span></label><label class="check"><input id="showDots" type="checkbox"><span>Punkty pomocnicze</span></label><label class="check"><input id="showGrid" type="checkbox"><span>Delikatna siatka pomocnicza</span></label><div class="section-title">3. Strona</div><label class="field"><span>Tytuł</span><input id="title" value="Complete the Picture"></label><label class="field"><span>Instrukcja</span><input id="instruction" value="Draw the missing half of the picture."></label><div class="row"><label class="field"><span>Liczba stron</span><input id="count" type="number" min="1" max="20" value="5"></label><label class="field"><span>Seed serii</span><input id="seed" value="fenix-ctp-001"></label></div><label class="field"><span>Zawartość serii</span><select id="seriesMode"><option value="selected">Ten sam motyw, różne warianty</option><option value="mixed">Różne motywy automatycznie</option></select></label><div class="actions sticky-actions"><button id="generate" class="primary">Generuj serię</button><button id="newVariant">Nowy wariant</button><button id="png" class="secondary">Eksport PNG 300 DPI</button><button id="cart" class="primary">Dodaj serię do Stron projektu</button></div><p id="status" class="status"></p></aside><section class="ctp-preview"><div class="preview-head"><div><strong>Podgląd strony</strong><small id="previewMeta"></small></div><div class="pager"><button id="prev">←</button><span id="pageCounter">0 / 0</span><button id="next">→</button></div></div><div class="canvas-toolbar"><button id="fitPreview" type="button">Dopasuj stronę</button><button id="zoomOut" type="button">−</button><span id="zoomLabel">Fit</span><button id="zoomIn" type="button">+</button></div><div class="canvas-wrap"><canvas id="page" width="850" height="1100"></canvas></div><div class="preview-actions"><button id="toggleSolution">Pokaż rozwiązanie</button></div></section></main>
<script src="../../core/page-schema.js?v=0.17.0"></script><script src="../../core/production-profile.js?v=0.17.0"></script><script src="complete-picture-core.js?v=0.17.0"></script><script src="../../core/fenix-core.js?v=0.22.7"></script><script src="complete-picture-v2.js?v=0.17.0"></script>
</body></html>
